<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог | Floynne</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="loading">
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div class="bg-glow"></div>

    <header>
        <div class="logo">FLOYNNE<span class="accent">.</span></div>
        <nav>
            <a href="index.html" class="hover-target back-btn">← Портфолио</a>
        </nav>
    </header>

    <main class="project-page">
        <section class="hero project-hero" style="min-height: 30vh; margin-top: 100px;">
            <h1 class="fade-up">Записи / База знаний</h1>
            <p class="subtitle fade-up delay-1">Мои мысли, туториалы, гайды по коду и геймингу.</p>
        </section>

        <section class="projects-section" style="padding-top: 0;">
            <div class="blog-header fade-up delay-2">
                <div class="search-box hover-target">
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск статей...">
                </div>
                <button class="btn btn-glow hover-target" onclick="openPinModal()">+ Написать статью</button>
            </div>

            <!-- Сетка со статьями -->
            <div class="projects-grid" id="blog-cards">
                <!-- Статьи будут генерироваться через JS -->
            </div>
        </section>
    </main>

    <!-- Окно: Ввод ПИН-кода -->
    <div class="modal-overlay" id="pinModal">
        <div class="modal-content hover-target">
            <span class="close-modal" onclick="closeModals()">✖</span>
            <span class="tag" style="margin-bottom: 10px; display: inline-block;">System.Auth</span>
            <h2>Требуется доступ</h2>
            <p style="color: #888; margin-bottom: 20px;">Введите 4-значный ПИН-код администратора</p>
            
            <input type="password" id="pinInput" class="cyber-input pin-display" maxlength="4" placeholder="••••" style="text-align: center;">
            <p class="error-text" id="pinError">Доступ запрещен. Неверный код.</p>
            
            <button class="btn btn-outline hover-target" onclick="verifyPin()">Авторизация</button>
        </div>
    </div>

    <!-- Окно: Редактор статьи -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal-content hover-target" style="max-width: 700px; text-align: left;">
            <span class="close-modal" onclick="closeModals()">✖</span>
            <span class="tag" style="margin-bottom: 10px; display: inline-block;">Write.Mode</span>
            <h2 style="margin-bottom: 20px;">Новая запись</h2>
            
            <input type="text" id="artTitle" class="cyber-input hover-target" placeholder="Заголовок статьи">
            <input type="text" id="artTag" class="cyber-input hover-target" placeholder="Тег (например: Coding, Gaming)">
            <input type="text" id="artDesc" class="cyber-input hover-target" placeholder="Краткое описание (для карточки)">
            <textarea id="artContent" class="cyber-input cyber-textarea hover-target" placeholder="Полный текст статьи... (можно использовать HTML-теги)"></textarea>
            
            <button class="btn btn-glow hover-target" style="width: 100%;" onclick="saveArticle()">Опубликовать</button>
        </div>
    </div>

    <!-- Подключаем основной скрипт и скрипт блога -->
    <script src="script.js"></script>
    <script src="blog-script.js"></script>
</body>
</html>
